services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-genaigrader}
      - POSTGRES_USER=${POSTGRES_USER:-genai_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genai_user} -d ${POSTGRES_DB:-genaigrader}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment the following lines if you need external access. Keeping them commented increases security.
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: genaigrader-ollama
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment if using GPU:
    #deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
    env_file:
      - ../.env
    volumes:
      - uploaded_files_data:/app/uploaded_files
      - staticfiles_data:/app/staticfiles

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - RUN_MIGRATIONS=0
      - RUN_COLLECTSTATIC=0
    env_file:
      - ../.env
    volumes:
      - uploaded_files_data:/app/uploaded_files
      - staticfiles_data:/app/staticfiles
    command: uv run manage.py qcluster

volumes:
  postgres_data:
  uploaded_files_data:
  staticfiles_data:
  ollama_data: